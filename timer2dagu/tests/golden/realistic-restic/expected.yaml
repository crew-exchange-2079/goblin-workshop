name: restic
description: "Run restic backup"
schedule:
- "30 2 * * *"
- "CRON_TZ=Europe/Berlin 0 10 * * 0,6"
catchup_window: "7d"
overlap_policy: latest
working_dir: "${HOME}"
dotenv:
- restic.env
- "${HOME}/.config/restic.env"
timeout_sec: 8100
steps:
- name: randomized-delay
  description: RandomizedDelaySec=15min
  run: "sleep $(( $(od -An -N4 -tu4 /dev/urandom) % 901 ))"
- name: exec-start-pre
  description: "ExecStartPre=/usr/bin/test -d ${RESTIC_REPOSITORY}"
  run: "/usr/bin/test -d \"${RESTIC_REPOSITORY}\""
  depends: randomized-delay
- name: exec-start
  description: "ExecStart=/usr/bin/restic backup --tag $TAG \"%h/my docs\""
  run: |-
    _t2d_add() {
      _t2d_ar=$1 _t2d_ao=
      while [ -n "$_t2d_ar" ]; do
        _t2d_ac=${_t2d_ar%"${_t2d_ar#?}"} _t2d_ar=${_t2d_ar#?}
        if [ "$_t2d_ac" = "'" ]; then _t2d_ao="$_t2d_ao'\''"; else _t2d_ao=$_t2d_ao$_t2d_ac; fi
      done
      _t2d_argv="$_t2d_argv '$_t2d_ao'"
    }
    _t2d_split() {
      _t2d_r=$1 _t2d_w= _t2d_in= _t2d_q= _t2d_bs=
      while [ -n "$_t2d_r" ]; do
        _t2d_c=${_t2d_r%"${_t2d_r#?}"} _t2d_r=${_t2d_r#?}
        if [ -n "$_t2d_bs" ]; then
          _t2d_bs= _t2d_w=$_t2d_w$_t2d_c
        elif [ "$_t2d_c" = '\' ]; then
          _t2d_bs=1 _t2d_in=1
        elif [ -n "$_t2d_q" ]; then
          if [ "$_t2d_c" = "$_t2d_q" ]; then _t2d_q=; else _t2d_w=$_t2d_w$_t2d_c; fi
        elif [ "$_t2d_c" = "'" ] || [ "$_t2d_c" = '"' ]; then
          _t2d_q=$_t2d_c _t2d_in=1
        else
          case $_t2d_ws in
            *"$_t2d_c"*) if [ -n "$_t2d_in" ]; then _t2d_add "$_t2d_w"; _t2d_w= _t2d_in=; fi ;;
            *) _t2d_w=$_t2d_w$_t2d_c _t2d_in=1 ;;
          esac
        fi
      done
      if [ -n "$_t2d_in" ]; then _t2d_add "$_t2d_w"; fi
    }
    _t2d_ws=$(printf ' \t\n\rx'); _t2d_ws=${_t2d_ws%x}
    _t2d_run1() {
      _t2d_argv=
      _t2d_add /usr/bin/restic
      _t2d_add backup
      _t2d_add --tag
      _t2d_split "${TAG-}"
      _t2d_add "${HOME}"'/my docs'
      eval "set -- $_t2d_argv"
      "$@"
    }
    _t2d_run1
  depends: exec-start-pre
handler_on:
