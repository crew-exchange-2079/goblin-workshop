name: tape-exporter mhvtl integration

# Loads the mhvtl kernel module on a disposable GitHub-hosted VM, creates ONE
# emulated tape drive (synthetic serial, no media) and runs lto-exporter
# against it. Never run tape-exporter/ci/mhvtl/run_integration.sh on a host
# you care about.

on:
  push:
    paths: ["tape-exporter/**", ".github/workflows/tape-exporter-mhvtl.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tape-exporter-mhvtl-${{ github.ref }}
  cancel-in-progress: true

env:
  MHVTL_REPO: https://github.com/markh794/mhvtl.git
  MHVTL_SHA: 37b0997c17efce10acc39abf777247b41ba05d3e
  PROM_VERSION: "3.14.0"
  PROM_SHA256: "f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d"

jobs:
  mhvtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
      - name: install build/test tools
        timeout-minutes: 8
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential \
            "linux-headers-$(uname -r)" sg3-utils lsscsi strace zlib1g-dev python3-venv
      - name: fetch mhvtl at the pinned commit
        timeout-minutes: 3
        run: |
          git init -q mhvtl
          git -C mhvtl fetch -q --depth 1 "$MHVTL_REPO" "$MHVTL_SHA"
          git -C mhvtl checkout -q --detach FETCH_HEAD
          test "$(git -C mhvtl rev-parse HEAD)" = "$MHVTL_SHA"
      - name: build mhvtl kernel module and daemons
        timeout-minutes: 8
        run: |
          make -C mhvtl/kernel
          make -C mhvtl usr -j"$(nproc)"
          ls -l mhvtl/kernel/mhvtl.ko mhvtl/usr/bin/vtltape
      - name: fetch pinned Prometheus
        timeout-minutes: 3
        run: |
          f="prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/$f"
          echo "${PROM_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
      - name: install lto-exporter into a venv readable by the unprivileged user
        run: |
          sudo python3 -m venv /opt/lto-ci/venv
          sudo /opt/lto-ci/venv/bin/pip install -q --disable-pip-version-check ./src/tape-exporter
          sudo chmod -R a+rX /opt/lto-ci
      - name: run integration (module load, one emulated drive, exporter under strace)
        timeout-minutes: 10
        run: |
          sudo env CI=true PATH="$PATH" \
            MHVTL_SRC="$GITHUB_WORKSPACE/mhvtl" LTO_VENV=/opt/lto-ci/venv \
            EVIDENCE="$RUNNER_TEMP/evidence" \
            PROMETHEUS_DIR="$RUNNER_TEMP/prometheus-${PROM_VERSION}.linux-amd64" \
            timeout 540 src/tape-exporter/ci/mhvtl/run_integration.sh
      - name: job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/evidence/summary.md" ]; then
            cat "$RUNNER_TEMP/evidence/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## mhvtl integration: NOT COMPLETED (no summary produced)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mhvtl-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          if-no-files-found: warn
