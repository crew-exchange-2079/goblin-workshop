name: tape-library-playground CI

on:
  push:
    paths: ["tape-library-playground/**", ".github/workflows/tape-library-playground-ci.yml"]
  pull_request:
    paths: ["tape-library-playground/**", ".github/workflows/tape-library-playground-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tape-library-playground-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tape-library-playground

jobs:
  test:
    name: tests and comparison table (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: node --test
      - name: Syntax check ui.js
        run: node --check ui.js
      - name: compare.txt matches a fresh run
        run: |
          out="$(mktemp)"
          node compare.mjs > "$out"
          diff -u compare.txt "$out"

  browser:
    name: browser tests (axe-core, keyboard, 360 px)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install pinned Playwright and axe-core
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright suite
        run: npx playwright test
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: tape-library-playground/test-results/
          retention-days: 7
