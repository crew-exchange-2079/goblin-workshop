name: rack-parts

on:
  push:
    paths:
      - "rack-parts/**"
      - ".github/workflows/rack-parts.yml"
  pull_request:
    paths:
      - "rack-parts/**"
      - ".github/workflows/rack-parts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rack-parts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        # Explicit "shell: bash" makes GitHub run "bash --noprofile --norc -eo pipefail {0}". Without it the
        # default is "bash -e {0}" (no pipefail), and "unittest | tee" would hide a failing test.
        shell: bash
        working-directory: rack-parts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      # Versions come from the Ubuntu 24.04 archive (OpenSCAD 2021.01, ADMesh 0.98.5)
      # and are recorded in every manifest.json.
      - name: Install OpenSCAD and ADMesh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad admesh
          openscad --version
          admesh --version
          python3 --version

      # Proves the pipeline below cannot mask a failure: the same "unittest ... | tee" construction is run on a
      # deliberately failing test and must exit non-zero.
      - name: Smoke - a failing test must fail the tee pipeline
        run: |
          set -o pipefail
          smoke="$(mktemp -d)"
          printf 'import unittest\n\n\nclass Smoke(unittest.TestCase):\n    def test_fails(self):\n        self.fail("deliberate")\n' > "$smoke/test_smoke.py"
          if python3 -m unittest discover -s "$smoke" -t "$smoke" -v 2>&1 | tee "$smoke/log"; then
            echo "pipeline exited 0 on a failing test: failures would be masked"; exit 1
          fi
          grep -q "FAILED (failures=1)" "$smoke/log"
          echo "ok: failing test made the pipeline fail"

      # RACKPARTS_REQUIRE_RENDER=1: shelf/PDU render tests fail instead of skipping if a tool is missing.
      - name: Unit, refusal and render tests
        env:
          RACKPARTS_REQUIRE_RENDER: "1"
        run: |
          set -o pipefail
          timeout 900 python3 -m unittest discover -s tests -t . -v 2>&1 | tee /tmp/rack-tests.log
          if grep -nE "skipped|SKIP" /tmp/rack-tests.log; then echo "a test was skipped; skips do not count as passes"; exit 1; fi

      - name: Render representative matrix
        run: |
          mkdir -p build
          for f in bracket-10in-1u bracket-19in-1u sff-cradle switch-cradle \
                   blank-10in-1u blank-19in-1u cable-10in-1u cable-19in-2u \
                   shelf-10in-1u shelf-10in-2u pdu-strip pdu-compact \
                   lacing-19in-1u label-19in-1u shelf-19in-1u-switch; do
            timeout 300 python3 -m rackparts generate "examples/$f-synthetic.json" --out "build/$f"
            timeout 120 python3 -m rackparts check-stl build/$f/*.stl > "build/$f/check-stl.json"
          done

      # Wall thickness, overhangs per print orientation and M6 cage-nut holes, measured on each STL. Every
      # example must pass except the two whose overhangs the README already flags (switch-cradle vent-window
      # and strap-slot bridges, SFF cradle retention lip); those must keep failing, so a regression either way
      # shows up. Reports are uploaded with the STLs.
      - name: Spec check rendered examples
        run: |
          expect_fail=" switch-cradle sff-cradle "
          bad=0
          for d in build/*/; do
            n=$(basename "$d")
            set +e
            timeout 300 python3 -m rackparts spec-check "$d" > "$d/spec-check.json"
            rc=$?
            set -e
            if [[ "$expect_fail" == *" $n "* ]]; then want=5; else want=0; fi
            echo "$n -> spec-check exit $rc (expected $want)"
            if [ "$rc" -ne "$want" ]; then bad=1; cat "$d/spec-check.json"; fi
          done
          exit $bad

      - name: Render small/large/boundary cases
        run: |
          mkdir -p build/boundary-inputs
          python3 -c "
          import json
          from tests import test_accessories, test_families, test_shelf_pdu
          for c in test_families.boundary_cases() + test_shelf_pdu.boundary_cases() + test_accessories.boundary_cases():
              with open('build/boundary-inputs/%s.json' % c['name'], 'x') as f:
                  json.dump(c, f, indent=2)
          "
          for f in build/boundary-inputs/*.json; do
            n=$(basename "$f" .json)
            timeout 300 python3 -m rackparts generate "$f" --out "build/boundary-$n"
            timeout 120 python3 -m rackparts check-stl build/boundary-$n/*.stl > "build/boundary-$n/check-stl.json"
          done

      - name: Expect refusals for invalid and unsafe inputs
        run: |
          for f in tests/fixtures/*.json; do
            set +e
            python3 -m rackparts generate "$f" --out "build/refused-$(basename "$f" .json)"
            rc=$?
            set -e
            echo "$f -> exit $rc"
            test "$rc" -eq 2
            test ! -e "build/refused-$(basename "$f" .json)"
          done

      - name: Summarise geometry
        run: |
          python3 -c "
          import glob, json
          print('| part | shells | volume mm3 | bbox size mm | admesh ok | spec-check (orientations passing) |')
          print('|---|---|---|---|---|---|')
          for m in sorted(glob.glob('build/*/manifest.json')):
              r = json.load(open(m))['mesh']
              try:
                  sc = json.load(open(m.replace('manifest.json', 'spec-check.json')))
                  spec = '%s (%s)' % ('pass' if sc['ok'] else 'FAIL', ', '.join(sc['overhangs']['passing']) or 'none')
              except OSError:
                  spec = '-'
              print('| %s | %d | %.3f | %s | %s | %s |' % (m.split('/')[1], r['shells'], r['volume_mm3'],
                    ' x '.join('%g' % v for v in r['bbox_size']), r['admesh']['ok'], spec))
          " | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload synthetic SCAD/STL/manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: rack-parts-synthetic-${{ github.sha }}
          path: rack-parts/build/
          if-no-files-found: error
          retention-days: 14
