name: rack-parts

on:
  push:
    paths:
      - "rack-parts/**"
      - "docs/**"
      - ".github/workflows/rack-parts.yml"
  pull_request:
    paths:
      - "rack-parts/**"
      - "docs/**"
      - ".github/workflows/rack-parts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rack-parts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        # Explicit "shell: bash" makes GitHub run "bash --noprofile --norc -eo pipefail {0}". Without it the
        # default is "bash -e {0}" (no pipefail), and "unittest | tee" would hide a failing test.
        shell: bash
        working-directory: rack-parts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Versions come from the Ubuntu 24.04 archive (OpenSCAD 2021.01, ADMesh 0.98.5)
      # and are recorded in every manifest.json.
      - name: Install OpenSCAD and ADMesh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends openscad admesh
          openscad --version
          admesh --version
          python3 --version

      # Proves the pipeline below cannot mask a failure: the same "unittest ... | tee" construction is run on a
      # deliberately failing test and must exit non-zero.
      - name: Smoke - a failing test must fail the tee pipeline
        run: |
          set -o pipefail
          smoke="$(mktemp -d)"
          printf 'import unittest\n\n\nclass Smoke(unittest.TestCase):\n    def test_fails(self):\n        self.fail("deliberate")\n' > "$smoke/test_smoke.py"
          if python3 -m unittest discover -s "$smoke" -t "$smoke" -v 2>&1 | tee "$smoke/log"; then
            echo "pipeline exited 0 on a failing test: failures would be masked"; exit 1
          fi
          grep -q "FAILED (failures=1)" "$smoke/log"
          echo "ok: failing test made the pipeline fail"

      # RACKPARTS_REQUIRE_RENDER=1: shelf/PDU render tests fail instead of skipping if a tool is missing.
      - name: Unit, refusal and render tests
        env:
          RACKPARTS_REQUIRE_RENDER: "1"
        run: |
          set -o pipefail
          timeout 900 python3 -m unittest discover -s tests -t . -v 2>&1 | tee /tmp/rack-tests.log
          if grep -nE "skipped|SKIP" /tmp/rack-tests.log; then echo "a test was skipped; skips do not count as passes"; exit 1; fi

      # Every example: STL + 3MF + PNG preview, mesh check, and the part's spec check re-run from the output.
      - name: Render every example (STL, 3MF, PNG) and spec-check it
        run: |
          mkdir -p build
          n=0
          for src in examples/*-synthetic.json; do
            f=$(basename "$src" -synthetic.json)
            timeout 300 python3 -m rackparts generate "$src" --out "build/$f" --png
            timeout 120 python3 -m rackparts check-stl build/$f/*.stl > "build/$f/check-stl.json"
            timeout 120 python3 -m rackparts spec-check "build/$f" > "build/$f/spec-check.json"
            for ext in stl 3mf png; do test -s build/$f/*.$ext; done
            n=$((n + 1))
          done
          echo "rendered $n examples"
          test "$n" -ge 22

      - name: Render small/large/boundary cases
        run: |
          mkdir -p build/boundary-inputs
          python3 -c "
          import json
          from tests import test_families, test_product_line, test_shelf_pdu
          for c in test_families.boundary_cases() + test_shelf_pdu.boundary_cases() + test_product_line.boundary_cases():
              with open('build/boundary-inputs/%s.json' % c['name'], 'x') as f:
                  json.dump(c, f, indent=2)
          "
          for f in build/boundary-inputs/*.json; do
            n=$(basename "$f" .json)
            timeout 300 python3 -m rackparts generate "$f" --out "build/boundary-$n"
            timeout 120 python3 -m rackparts check-stl build/boundary-$n/*.stl > "build/boundary-$n/check-stl.json"
            timeout 120 python3 -m rackparts spec-check "build/boundary-$n" > "build/boundary-$n/spec-check.json"
          done

      - name: Expect refusals for invalid and unsafe inputs
        run: |
          for f in tests/fixtures/*.json; do
            set +e
            python3 -m rackparts generate "$f" --out "build/refused-$(basename "$f" .json)"
            rc=$?
            set -e
            echo "$f -> exit $rc"
            test "$rc" -eq 2
            test ! -e "build/refused-$(basename "$f" .json)"
          done

      # The committed docs catalog must match what the current code renders: page text exactly, previews pixel for pixel.
      - name: Catalog page is current
        run: |
          timeout 900 python3 -m rackparts catalog --check ../docs/rack-parts
          timeout 900 python3 -m rackparts catalog --out build/catalog > /dev/null

      - name: Summarise geometry
        run: |
          python3 -c "
          import glob, json
          print('| part | shells | volume mm3 | bbox size mm | admesh ok | spec probes | outputs |')
          print('|---|---|---|---|---|---|---|')
          for m in sorted(glob.glob('build/*/manifest.json')):
              man = json.load(open(m))
              r, sc = man['mesh'], man['spec_check']
              print('| %s | %d | %.3f | %s | %s | %d/%d | %s |' % (m.split('/')[1], r['shells'], r['volume_mm3'],
                    ' x '.join('%g' % v for v in r['bbox_size']), r['admesh']['ok'], sc['probes'] - sc['failed'],
                    sc['probes'], ', '.join(sorted(man['files']))))
          " | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload synthetic SCAD/STL/3MF/PNG/manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rack-parts-synthetic-${{ github.sha }}
          path: |
            rack-parts/build/
            !rack-parts/build/catalog/
          if-no-files-found: error
          retention-days: 14

      - name: Upload catalog page and PNG previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rack-parts-catalog-${{ github.sha }}
          path: rack-parts/build/catalog/
          if-no-files-found: error
          retention-days: 14
