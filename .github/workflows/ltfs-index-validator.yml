name: ltfs-index-validator CI

on:
  push:
    paths: ["ltfs-index-validator/**", ".github/workflows/ltfs-index-validator.yml"]
  pull_request:
    paths: ["ltfs-index-validator/**", ".github/workflows/ltfs-index-validator.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ltfs-index-validator

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes --only-binary=:all: -r requirements.txt
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/python validate.py --input fixtures/valid-nested.xml
      - run: "! .venv/bin/python validate.py --input fixtures/valid-nested.xml --bogus"

  web:
    name: web viewer (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ltfs-index-validator/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # validate.py is the XSD authority; the mirror tests compare against it.
      - name: Install validate.py dependency
        run: |
          python -m venv ../.venv
          ../.venv/bin/pip install --require-hashes --only-binary=:all: -r ../requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Syntax check
        run: node --check ltfs.js && node --check viewer.js
      - name: Playwright tests
        env:
          CI: "1"
          LTFS_PYTHON: ${{ github.workspace }}/ltfs-index-validator/.venv/bin/python
        run: npx playwright test
