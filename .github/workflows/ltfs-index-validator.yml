name: ltfs-index-validator CI

on:
  push:
    paths: ["ltfs-index-validator/**", ".github/workflows/ltfs-index-validator.yml"]
  pull_request:
    paths: ["ltfs-index-validator/**", ".github/workflows/ltfs-index-validator.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ltfs-index-validator-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ltfs-index-validator

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes --only-binary=:all: -r requirements.txt
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/python validate.py --input fixtures/valid-nested.xml
      - run: "! .venv/bin/python validate.py --input fixtures/valid-nested.xml --bogus"
