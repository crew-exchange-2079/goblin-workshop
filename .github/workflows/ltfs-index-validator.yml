name: ltfs-index-validator CI

on:
  push:
    paths: ["ltfs-index-validator/**", ".github/workflows/ltfs-index-validator.yml"]
  pull_request:
    paths: ["ltfs-index-validator/**", ".github/workflows/ltfs-index-validator.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ltfs-index-validator-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ltfs-index-validator

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes --only-binary=:all: -r requirements.txt
          .venv/bin/pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/python tests/make_corpus.py --check
      - run: .venv/bin/python validate.py --input fixtures/valid-nested.xml
      - run: |
          set +e
          .venv/bin/python validate.py --input corpus/bad/extent-overlap.xml; test $? -eq 1 || exit 1
          .venv/bin/python validate.py --input corpus/bad/name-not-nfc.xml --strict; test $? -eq 1 || exit 1
          .venv/bin/python validate.py --input fixtures/valid-nested.xml --bogus; test $? -eq 3 || exit 1
          exit 0
