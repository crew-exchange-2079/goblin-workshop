name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One independent job per project: a failure in one never cancels the others
# (jobs do not use `needs`), and inside a job the first failing step stops it.
jobs:
  tapefec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tapefec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check -r ../.github/ci-requirements.txt
      - run: python -m pytest -q test_tapefec.py

  tape-exporter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tape-exporter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check -r ../.github/ci-requirements.txt
      - run: python -m pytest -q tests

  rack-parts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rack-parts
    env:
      # Shelf/PDU render tests fail instead of skipping when a tool is missing.
      RACKPARTS_REQUIRE_RENDER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt
      - name: Install OpenSCAD and ADMesh (render tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends openscad admesh
      - run: python -m pip install --disable-pip-version-check -r ../.github/ci-requirements.txt
      - run: python -m pytest -q tests

  ltfs-index-validator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ltfs-index-validator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .github/ci-requirements.txt
            ltfs-index-validator/requirements.txt
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt
      - run: python -m pip install --disable-pip-version-check -r ../.github/ci-requirements.txt
      - run: python -m pytest -q tests

  mhvtl-status:
    # Runner boundary tests only. The full build-and-sanitizer run stays in
    # mhvtl-status-ci.yml because it needs a toolchain and clones upstream.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tape-regression-lab/mhvtl-status
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check -r ../../.github/ci-requirements.txt
      - run: timeout --kill-after=5s 120s python -m pytest -q test_runner.py

  sweep:
    # Regression tests for the input-handling bugs fixed in the 2026-10-22 sweep
    # (see FINDINGS.md). They span tapefec and rack-parts, so they run from the root.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check -r .github/ci-requirements.txt
      - run: python -m pytest -q tests/sweep

  hsm-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hsm-sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .github/ci-requirements.txt
            hsm-sim/requirements.txt
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements.txt
      - run: python -m pip install --disable-pip-version-check -r ../.github/ci-requirements.txt
      - run: python -m pytest -q tests

  dagu-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dagu-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .github/ci-requirements.txt
            dagu-lint/requirements-schema.txt
      # requirements-schema.txt is requirements.txt plus jsonschema, for test_schema.py.
      - run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-schema.txt
      - run: python -m pip install --disable-pip-version-check -r ../.github/ci-requirements.txt
      # Dagu's own schema (GPL-3.0, not vendored) at the commit the rules were written against.
      - name: Fetch Dagu DAG schema
        env:
          DAGU_COMMIT: f609cae2b21fdd3cb4f72376e2edb9a8c9e35c45
          DAGU_SCHEMA_SHA256: ec94f3c0e9216daa0a51b6dc3897ec7c856827f8d96578d0cdbc823e69a03abd
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dag.schema.json" \
            "https://raw.githubusercontent.com/dagu-org/dagu/$DAGU_COMMIT/internal/cmn/schema/dag.schema.json"
          echo "$DAGU_SCHEMA_SHA256  $RUNNER_TEMP/dag.schema.json" | sha256sum -c -
      - run: python -m pytest -q tests
        env:
          DAGU_SCHEMA: ${{ runner.temp }}/dag.schema.json
          # Schema tests fail instead of skipping when the schema or jsonschema is missing.
          DAGU_LINT_REQUIRE_SCHEMA: "1"

  dagu-lint-action:
    # Runs dagu-lint/action.yml the way a consumer would.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Good fixtures pass
        uses: ./dagu-lint
        with:
          paths: dagu-lint/fixtures/good
          config: dagu-lint/fixtures/dagu-lint.toml
      - name: Bad fixtures fail
        id: bad
        continue-on-error: true
        uses: ./dagu-lint
        with:
          paths: |
            dagu-lint/fixtures/bad/queue-typo.yaml
            dagu-lint/fixtures/bad/exec-command-args.yaml
          config: dagu-lint/fixtures/dagu-lint.toml
          format: text
      - name: Expect the bad run to have failed
        env:
          OUTCOME: ${{ steps.bad.outcome }}
        run: test "$OUTCOME" = failure

  tape-library-playground:
    # JavaScript project: no Python, no pip.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tape-library-playground
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node --test

  examples:
    # End-to-end walkthroughs in examples/ (synthetic data, real containers).
    # Static checks first, then each live walkthrough is run, checked and torn
    # down by run_walkthrough.py; a fresh recording is kept as evidence.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt
      - run: python -m pip install --disable-pip-version-check -r .github/ci-requirements.txt
      - name: static checks (no Docker)
        run: python -m pytest -q examples/tests
      - name: tool versions
        run: docker version --format 'docker {{.Server.Version}}' && docker compose version
      - name: exporter -> Grafana
        timeout-minutes: 12
        run: |
          mkdir -p "$RUNNER_TEMP/examples"
          python examples/run_walkthrough.py exporter-to-grafana \
            --cast "$RUNNER_TEMP/examples/exporter-to-grafana.cast"
      - name: nothing left behind
        if: always()
        run: |
          left="$(docker ps -aq --filter label=com.docker.compose.project)"
          if [ -n "$left" ]; then docker ps -a; exit 1; fi
          echo "no walkthrough containers remain"
      - name: upload recordings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: examples-recordings
          path: ${{ runner.temp }}/examples
          retention-days: 14
          if-no-files-found: warn
