name: tapefec CI

on:
  push:
    paths: ["tapefec/**", ".github/workflows/tapefec-ci.yml"]
  pull_request:
    paths: ["tapefec/**", ".github/workflows/tapefec-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tapefec-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tapefec

jobs:
  test:
    name: unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest -v test_tapefec
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
      - name: Property-based tests
        run: python -m unittest -v test_properties
      - name: Fuzz (fixed seeds; replay a failure with fuzz.py --replay SEED)
        run: |
          python fuzz.py --cases 50000 --seed 1
          python fuzz.py --cases 5000 --seed 2 --forge
