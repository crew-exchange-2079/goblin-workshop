# Hex digests and UUIDs are not flagged as secrets.
# expect: clean
name: sample
queue: default
schedule: "0 2 * * *"
timeout_sec: 3600
handler_on:
  failure:
    run: ./notify.sh "${DAG_NAME}" failed
params:
  - IMAGE: registry.example.invalid/app@sha256:9b2a5c1e7f3d4a6b8c0e2f4a6b8c0d1e3f5a7b9c1d3e5f7a9b1c3d5e7f9a1b3c
  - RUN_ID: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
  - COMMIT: 4f3db31e8a1b2c3d4e5f60718293a4b5c6d7e8f9
steps:
  - id: deploy
    run: ./deploy.sh "${IMAGE}"
