# One-off future run plus a profile-scoped cron entry.
# expect: clean
name: sample
queue: default
schedule: 
  - at: "2027-03-01T09:30:00Z"
  - kind: cron
    expression: "@weekly"
    profile: staging
timeout_sec: 3600
handler_on:
  failure:
    run: ./notify.sh "${DAG_NAME}" failed
steps:
  - id: hello
    run: echo hello
