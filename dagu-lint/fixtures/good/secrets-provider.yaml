# Secrets come from a provider; env only references them.
# expect: clean
name: sample
queue: default
schedule: "0 2 * * *"
timeout_sec: 3600
handler_on:
  failure:
    run: ./notify.sh "${DAG_NAME}" failed
secrets:
  - name: DB_PASSWORD
    provider: env
    key: PROD_DB_PASSWORD
  - name: API_TOKEN
    ref: team/payments-api
env:
  - API_URL: https://api.example.invalid
  - TOKEN_HEADER: ${API_TOKEN}
  - DB_PASSWORD_FILE: /run/secrets/db_password
steps:
  - id: call
    run: ./call.sh
