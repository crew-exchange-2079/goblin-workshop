# Numeric and boolean settings under secret-ish names are not secrets.
# expect: clean
name: sample
queue: default
timeout_sec: 3600
handler_on:
  failure:
    run: ./notify.sh "${DAG_NAME}" failed
schedule: "0 2 * * *"
env:
  TOKEN_TTL_SEC: 3600
  PASSWORD_MIN_LENGTH: 12
  AUTH_RETRIES: 3
  AUTH_ENABLED: true
steps:
  - id: hello
    run: echo hello
