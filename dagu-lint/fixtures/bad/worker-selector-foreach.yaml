# worker_selector inside a foreach body.
# expect: DL701
name: sample
queue: default
schedule: "0 2 * * *"
timeout_sec: 3600
handler_on:
  failure:
    run: ./notify.sh "${DAG_NAME}" failed
steps:
  - id: fan
    foreach:
      items: [a, b]
      steps:
        - id: each
          run: ./each.sh
          worker_selector: {pool: batch}
