# PEM private key block inline.
# expect: DL402
name: sample
queue: default
schedule: "0 2 * * *"
timeout_sec: 3600
handler_on:
  failure:
    run: ./notify.sh "${DAG_NAME}" failed
steps:
  - id: ssh
    run: |
      cat > key <<'EOF'
      -----BEGIN OPENSSH PRIVATE KEY-----
      this-is-not-a-key
      -----END OPENSSH PRIVATE KEY-----
      EOF
