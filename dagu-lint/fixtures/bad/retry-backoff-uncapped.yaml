# Exponential backoff with no cap.
# expect: DL603
name: sample
queue: default
schedule: "0 2 * * *"
timeout_sec: 3600
handler_on:
  failure:
    run: ./notify.sh "${DAG_NAME}" failed
steps:
  - id: flaky
    run: ./flaky.sh
    retry_policy:
      limit: 3
      interval_sec: 10
      backoff: true
