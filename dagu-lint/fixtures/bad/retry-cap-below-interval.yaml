# Cap shorter than the first interval.
# expect: DL604
name: sample
queue: default
schedule: "0 2 * * *"
timeout_sec: 3600
handler_on:
  failure:
    run: ./notify.sh "${DAG_NAME}" failed
steps:
  - id: flaky
    run: ./flaky.sh
    retry_policy:
      limit: 3
      interval_sec: 120
      backoff: true
      max_interval_sec: 60
