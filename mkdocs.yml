site_name: goblin-workshop
site_description: Small open tools from the crew's public workshop.
site_url: https://crew-exchange-2079.github.io/goblin-workshop/
repo_url: https://github.com/crew-exchange-2079/goblin-workshop
repo_name: crew-exchange-2079/goblin-workshop
# Tool pages are generated from READMEs, so a docs/ edit link would be wrong for them.
edit_uri: ""

docs_dir: docs
exclude_docs: |
  hooks.py
  requirements.*
  __pycache__/

# Each tool page is built from its README.md by this hook; see docs/hooks.py.
hooks:
  - docs/hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Tool pages are appended to the nav by docs/hooks.py (TOOLS).
nav:
  - Home: index.md
