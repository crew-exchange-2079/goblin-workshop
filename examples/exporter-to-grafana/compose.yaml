# Walkthrough: tape-exporter -> Prometheus -> Grafana, synthetic data only.
#
#   exporter    the real lto_exporter Collector and HTTP handler, with sg_logs
#               replaced by synthetic text (tape-exporter/ci/grafana/
#               synthetic_target.py, the same targets the Grafana smoke test
#               uses). No command is run and no device is opened.
#   prometheus  scrapes both synthetic exporters and loads the repo's alert
#               rules (monitoring/prometheus/lto-exporter-alerts.yml) unmodified.
#   grafana     provisions the repo dashboard (monitoring/grafana/) unmodified;
#               anonymous read-only Viewer, no login, no admin session.
#
# Ports are published on 127.0.0.1 only. Images are pinned by digest, the same
# digests as tape-exporter/ci/grafana/smoke.py (examples/tests checks they match).
name: lto-walkthrough

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 512
  mem_limit: 1g

services:
  exporter:
    <<: *hardening
    image: docker.io/library/python:3.13.16-alpine3.24@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
    user: "65534:65534"
    command: ["python3", "-I", "-B", "/synth/synthetic_target.py", "/src"]
    volumes:
      - ../../tape-exporter/lto_exporter:/src/lto_exporter:ro
      - ../../tape-exporter/ci/grafana/synthetic_target.py:/synth/synthetic_target.py:ro
    ports:
      - "127.0.0.1:${EXPORTER_PORT:-9101}:9101"   # healthy target (drive0, drive1)

  prometheus:
    <<: *hardening
    image: docker.io/prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=:9090
    tmpfs: ["/prometheus:rw,size=128m,uid=65534"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../tape-exporter/monitoring/prometheus/lto-exporter-alerts.yml:/etc/prometheus/rules/lto-exporter-alerts.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    <<: *hardening
    image: docker.io/grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/lto-dashboards/lto-exporter-dashboard.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_LOG_LEVEL: warn
    tmpfs:
      - "/var/lib/grafana:rw,size=256m,uid=472"
      - "/tmp:rw,size=64m,uid=472"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../tape-exporter/monitoring/grafana:/var/lib/lto-dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
