# Walkthrough Prometheus. Scrapes the two synthetic exporters (see compose.yaml)
# and evaluates the repo's alert rules. Short intervals so the walkthrough has
# data within seconds; a real deployment would use the defaults.
global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s
rule_files:
  - /etc/prometheus/rules/lto-exporter-alerts.yml
scrape_configs:
  - job_name: lto-exporter
    static_configs:
      - targets: ["exporter:9101", "exporter:9102"]
