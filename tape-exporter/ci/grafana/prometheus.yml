# Prometheus for the Grafana smoke test only (disposable container, internal
# network). Targets are the synthetic exporters in synthetic_target.py plus
# one host name that does not exist, so its `up` is 0 and it exports nothing.
global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 2s
scrape_configs:
  - job_name: lto-exporter
    static_configs:
      - targets: ["lto-synth:9101", "lto-synth:9102", "lto-absent:9103"]
