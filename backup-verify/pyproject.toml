[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "backup-verify"
dynamic = ["version"]
description = "Prove restic and PostgreSQL (pg_dump, pgBackRest) backups are restorable; emits Prometheus textfile metrics and a JSON report"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "goblin-workshop contributors"}]
keywords = ["backup", "restore", "restic", "postgresql", "pgbackrest", "prometheus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
backup-verify = "backup_verify.cli:main"

[tool.setuptools]
packages = ["backup_verify"]

[tool.setuptools.dynamic]
version = {attr = "backup_verify.__version__"}
